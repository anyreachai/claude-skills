[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "status-deck"
version = "0.1.0"
description = "PPTX status deck builder"
dependencies = [
    "python-pptx>=0.6.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]
